# ==============================================================================
# NGINX CONFIGURATION FOR CAR CARE LUXURY DETAILING
# Subdomain: srcars.gemshine.tech
# Backend Node.js Port: 5030
# Place this file at: /etc/nginx/sites-available/srcars.gemshine.tech
# Enable with: sudo ln -s /etc/nginx/sites-available/srcars.gemshine.tech /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream Backend Cluster
upstream carcare_backend {
    server 127.0.0.1:5030;
    keepalive 64;
}

# 1. HTTP -> Redirect all port 80 traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name srcars.gemshine.tech;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srcars.gemshine.tech;

    # SSL Certificates (Generated via Certbot: sudo certbot --nginx -d srcars.gemshine.tech)
    ssl_certificate /etc/letsencrypt/live/srcars.gemshine.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srcars.gemshine.tech/privkey.pem;

    # High Security SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Static Root Path (Built Vite files)
    root /var/www/srcars.gemshine.tech/dist;
    index index.html;

    # Gzip Compression for Ultra-Fast Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client Request Size
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # API REVERSE PROXY -> Node.js Express Backend on Port 5030
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://carcare_backend;
        proxy_http_version 1.1;

        # WebSocket & Connection Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP & Host Propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # STATIC ASSETS CACHING (Images, JS, CSS, Videos)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # FRONTEND SPA ROUTING (React Router / Hash / Clean URLs)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
