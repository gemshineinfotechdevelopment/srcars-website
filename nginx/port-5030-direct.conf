# ==============================================================================
# ALTERNATIVE NGINX CONFIGURATION: NGINX LISTENING DIRECTLY ON PORT 5030
# Use this ONLY if you want the public URL to be: http://srcars.gemshine.tech:5030
# (If using standard HTTPS http://srcars.gemshine.tech, use srcars.gemshine.tech.conf instead)
# ==============================================================================

server {
    listen 5030;
    listen [::]:5030;
    server_name srcars.gemshine.tech;

    root /var/www/srcars.gemshine.tech/dist;
    index index.html;

    client_max_body_size 25M;

    # Backend API Proxy (assuming backend Node process runs on internal port 5000 or 5031)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
